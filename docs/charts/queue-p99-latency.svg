<text class="label" x="20" y="275">Multi-row VALUES (SqlCommand)</text>
<rect class="bar" x="330" y="248" width="352.0" height="42" rx="4"/>
<text class="value" x="690.0" y="275">249.3 milliseconds</text>
<text class="label" x="20" y="337">SqlBulkCopy (SqlBulkCopy)</text>
