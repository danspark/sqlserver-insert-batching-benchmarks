<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="400" viewBox="0 0 1050 400" role="img" aria-label="p99 delivery-to-acknowledgment latency">
<style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#17202a}.title{font-size:22px;font-weight:700}.label{font-size:14px}.value{font-size:14px;font-weight:650}.bar{fill:#2878b5}</style>
<rect width="1050" height="400" fill="#fff"/><text class="title" x="20" y="34">p99 delivery-to-acknowledgment latency</text>
