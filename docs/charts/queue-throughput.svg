<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Best observed queue throughput">
<style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#17202a}.title{font-size:22px;font-weight:700}.label{font-size:14px}.value{font-size:14px;font-weight:650}.bar{fill:#2878b5}</style>
<rect width="900" height="400" fill="#fff"/><text class="title" x="20" y="34">Best observed queue throughput</text>
<text class="label" x="20" y="89">Individual insert per message</text>
<rect class="bar" x="205" y="62" width="18.6" height="42" rx="4"/>
<text class="value" x="231.6" y="89">119.1 committed rows/s</text>
<text class="label" x="20" y="151">Table-valued parameter</text>
<rect class="bar" x="205" y="124" width="565.0" height="42" rx="4"/>
<text class="value" x="778.0" y="151">3,614.7 committed rows/s</text>
<text class="label" x="20" y="213">Multiple INSERT statements</text>
<rect class="bar" x="205" y="186" width="450.3" height="42" rx="4"/>
<text class="value" x="663.3" y="213">2,880.8 committed rows/s</text>
<text class="label" x="20" y="275">Multi-row VALUES</text>
<rect class="bar" x="205" y="248" width="29.4" height="42" rx="4"/>
<text class="value" x="242.4" y="275">188.2 committed rows/s</text>
<text class="label" x="20" y="337">SqlBulkCopy</text>
<rect class="bar" x="205" y="310" width="488.0" height="42" rx="4"/>
<text class="value" x="701.0" y="337">3,122.2 committed rows/s</text>
</svg>
