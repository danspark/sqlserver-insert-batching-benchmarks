<text class="label" x="20" y="151">Table-valued parameter</text>
<rect class="bar" x="205" y="124" width="565.0" height="42" rx="4"/>
<text class="value" x="778.0" y="151">29,082.4 committed rows/s</text>
<text class="label" x="20" y="213">Multiple INSERT statements</text>
<rect class="bar" x="205" y="186" width="294.0" height="42" rx="4"/>
<text class="value" x="507.0" y="213">15,132.1 committed rows/s</text>
<text class="label" x="20" y="275">Multi-row VALUES</text>
<rect class="bar" x="205" y="248" width="262.4" height="42" rx="4"/>
<text class="value" x="475.4" y="275">13,505.1 committed rows/s</text>
<text class="label" x="20" y="337">SqlBulkCopy</text>
<rect class="bar" x="205" y="310" width="447.8" height="42" rx="4"/>
