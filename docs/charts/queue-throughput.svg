<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Best observed queue throughput">
<style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#17202a}.title{font-size:22px;font-weight:700}.label{font-size:14px}.value{font-size:14px;font-weight:650}.bar{fill:#2878b5}</style>
<rect width="900" height="400" fill="#fff"/><text class="title" x="20" y="34">Best observed queue throughput</text>
<text class="label" x="20" y="89">Individual insert per message</text>
<rect class="bar" x="205" y="62" width="58.4" height="42" rx="4"/>
